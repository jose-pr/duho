name: Docs

# Builds the docs site and deploys it to GitHub Pages. Kept separate from
# release.yml so the site can be rebuilt/redeployed without cutting a
# release, and a release is never the first time the docs build is
# exercised. This workflow owns EVERY Pages deploy; release.yml only gates on
# a strict `mkdocs build --strict` and dispatches this workflow at its tag.
#
# Triggers:
#   - push to the default branch touching docs sources -- src/** because the
#     API reference is generated from src/ docstrings by mkdocstrings, and
#     CHANGELOG.md because docs/changelog.md snippet-embeds it.
#   - workflow_dispatch, for a manual redeploy against any ref; release.yml
#     dispatches it at a final tag. A release created with the workflow token
#     starts no workflow, so there is no `release: published` trigger.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys; never cancel an in-flight Pages deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-build:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs,colorama,config]"
      - name: Build docs
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  docs-deploy:
    name: Deploy documentation to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
