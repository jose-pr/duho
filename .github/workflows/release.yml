name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    # Reuse test.yml wholesale via workflow_call: its matrix, coverage gate,
    # benchmark regression gate, zsh/fish completion legs, and strict
    # `mkdocs build` docs gate all run here, instead of a second, narrower
    # "3.9 + newest" copy that can silently stop being exercised (the
    # dispatch/ci-* triggered test.yml went unrun across three prior
    # releases while this thinner gate kept passing).
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify-wheel:
    # Every job above tests an editable src/ checkout; nothing otherwise
    # installs the built wheel itself, so a packaging regression (a dropped
    # force-include, a misplaced py.typed, a mis-rooted `packages` config)
    # could ship unnoticed even with a fully green suite. Install it fresh,
    # on the floor and the latest supported interpreter, and check the
    # resources PYTHON.md requires actually reach site-packages.
    name: Verify installed wheel (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"] # floor + latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel (no sdist/src fallback)
        run: python -m pip install --no-index --find-links dist duho
      - name: Check shipped package resources
        run: |
          python - <<'PY'
          import importlib.resources as r
          import duho

          pkg = r.files(duho)
          missing = [n for n in ("py.typed", "README.md", "AGENTS.md") if not (pkg / n).is_file()]
          if missing:
              raise SystemExit(f"missing from installed wheel: {missing}")
          print("wheel resources OK")
          PY

  github-release:
    name: Create GitHub Release
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        run: |
          import pathlib
          import re
          import sys

          tag = "${{ github.ref_name }}"
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Pin the release object to the exact commit the tag pointed at.
          # Left unset it defaults to the repository's default branch, so a
          # release created before a branch rename (or any later rename)
          # keeps pointing at a branch that may no longer exist.
          target_commitish: ${{ github.sha }}
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duho/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially-completed release re-run must not hard-fail on files
          # already uploaded (PyPI never lets a version be replaced); skip
          # them and publish only what's missing.
          skip-existing: true
