name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    # Reuse test.yml wholesale via workflow_call: its matrix, coverage gate,
    # benchmark regression gate, zsh/fish completion legs, and strict
    # `mkdocs build` docs gate all run here, instead of a second, narrower
    # "3.9 + newest" copy that can silently stop being exercised (the
    # dispatch/ci-* triggered test.yml went unrun across three prior
    # releases while this thinner gate kept passing).
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify-wheel:
    # Every job above tests an editable src/ checkout; nothing otherwise
    # installs the built wheel itself, so a packaging regression (a dropped
    # force-include, a misplaced py.typed, a mis-rooted `packages` config)
    # could ship unnoticed even with a fully green suite. Install it fresh,
    # on the floor and the latest supported interpreter, and check the
    # resources PYTHON.md requires actually reach site-packages.
    name: Verify installed wheel (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"] # floor + latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel (no sdist/src fallback)
        run: python -m pip install --no-index --find-links dist duho
      - name: Check shipped package resources
        run: |
          python - <<'PY'
          import importlib.resources as r
          import duho

          pkg = r.files(duho)
          missing = [n for n in ("py.typed", "README.md", "AGENTS.md") if not (pkg / n).is_file()]
          if missing:
              raise SystemExit(f"missing from installed wheel: {missing}")
          print("wheel resources OK")
          PY

  github-release:
    name: Create GitHub Release
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # Pin the release object to the exact commit the tag pointed at.
          # Left unset it defaults to the repository's default branch, so a
          # release created before a branch rename (or any later rename)
          # keeps pointing at a branch that may no longer exist.
          target_commitish: ${{ github.sha }}
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    # A pre-release tag (v1.0.0-rc.1) gets a GitHub release and no PyPI upload:
    # a PyPI version can never be reused.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duho/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially-completed release re-run must not hard-fail on files
          # already uploaded (PyPI never lets a version be replaced); skip
          # them and publish only what's missing. The build job's tag/version
          # check keeps it from masking a wrong tag.
          skip-existing: true

  # Events made with the workflow's own GITHUB_TOKEN, such as the release above,
  # start no workflows, so docs.yml cannot listen for the release itself. A
  # workflow_dispatch is the exception: it deploys the docs at this tag. A
  # pre-release leaves the published docs alone. Off the publish chain, so a
  # docs problem never blocks a package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
