[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duho"
version = "0.6.4"
authors = [{ name = "Jose A." }]
description = "A declarative CLI framework for building command-line applications with minimal boilerplate"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
colorama = ["colorama"]
config = ["tomli; python_version < '3.11'"]
dev = [
    "black",
    "build",
    "hatchling",
    "hypothesis",
    "pytest",
    "pytest-cov",
    "twine",
    # Dev-only MCP SDK conformance oracle, never a runtime or `duho[mcp]`
    # dependency: duho.mcp stays its own zero-dependency stdlib server (keeps
    # the 3.9 floor); the official SDK is 3.10+-only and only used here to
    # verify duho's server against a real client -- see
    # tests/test_mcp_sdk_conformance.py, which pytest.importorskip("mcp")s
    # and skips cleanly on 3.9/without it.
    "mcp; python_version >= '3.10'",
]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/duho/"
Documentation = "https://jose-pr.github.io/duho/"
Issues = "https://github.com/jose-pr/duho/issues"
Repository = "https://github.com/jose-pr/duho"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/duho/AGENTS.md is included automatically by living in the package
# dir; README.md needs the force-include below to also land inside the
# installed package. There is no committed repo-root AGENTS.md.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "duho/README.md"

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/benchmarks", "*.local.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "benchmarks"]
markers = [
    "requires_toml: skip when neither tomllib (3.11+) nor the tomli backport is importable",
]

[tool.black]
target-version = ["py39"]
